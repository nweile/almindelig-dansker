<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>almindeligdansker.dk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', 'Helvetica', 'Roboto', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #ffb6c1;
            /* DANNEBROG – lyserøde nuancer */
            background-image: 
                linear-gradient(to right, 
                    rgba(255, 255, 255, 0.50) 0%,
                    rgba(255, 200, 210, 0.55) 15%,
                    rgba(255, 255, 255, 0.50) 30%,
                    rgba(255, 200, 210, 0.55) 45%,
                    rgba(255, 255, 255, 0.50) 55%,
                    rgba(255, 200, 210, 0.55) 70%,
                    rgba(255, 255, 255, 0.50) 85%,
                    rgba(255, 200, 210, 0.55) 100%
                ),
                linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.50) 0%,
                    rgba(255, 200, 210, 0.55) 20%,
                    rgba(255, 255, 255, 0.50) 35%,
                    rgba(255, 200, 210, 0.55) 50%,
                    rgba(255, 255, 255, 0.50) 60%,
                    rgba(255, 200, 210, 0.55) 75%,
                    rgba(255, 255, 255, 0.50) 85%,
                    rgba(255, 200, 210, 0.55) 100%
                ),
                linear-gradient(135deg, #d87093 0%, #c71585 40%, #8b0a50 70%, #c71585 100%);
            background-size: 100% 100%, 30% 100%, 100% 100%;
            background-position: center center, 50% 58% center, center center;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-blend-mode: overlay, overlay, normal;
            animation: flagPulse 10s ease-in-out infinite alternate;
            padding: 0.5rem 1rem 0.5rem;
        }

        @keyframes flagPulse {
            0% { 
                background-image: 
                    linear-gradient(to right, rgba(255,255,255,0.45) 0%, rgba(255,200,210,0.50) 50%, rgba(255,255,255,0.45) 100%),
                    linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,200,210,0.50) 50%, rgba(255,255,255,0.45) 100%),
                    linear-gradient(135deg, #d87093 0%, #c71585 40%, #8b0a50 70%, #c71585 100%);
            }
            100% { 
                background-image: 
                    linear-gradient(to right, rgba(255,255,255,0.55) 0%, rgba(255,180,190,0.60) 50%, rgba(255,255,255,0.55) 100%),
                    linear-gradient(to bottom, rgba(255,255,255,0.55) 0%, rgba(255,180,190,0.60) 50%, rgba(255,255,255,0.55) 100%),
                    linear-gradient(135deg, #ff69b4 0%, #db2777 40%, #9d174d 70%, #db2777 100%);
            }
        }

        /* ---------- TITLE – GARANTERET PASSE R PÅ SKÆRMEN ---------- */
        .top-title {
            width: 100%;
            max-width: 600px;
            flex-shrink: 0;
            text-align: center;
            padding: 0.2rem 0;
            margin-top: env(safe-area-inset-top, 0px);
            /* BEGRÆNS MAKS HØJDE */
            max-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            flex-wrap: nowrap;
            /* FORCE WRAP PÅ SMÅ SKÆRME */
        }

        .title-row .flag-icon {
            font-size: min(8vw, 3.6rem);
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 12px rgba(0,0,0,0.2));
        }

        .top-title h1 {
            font-family: 'Arial', 'Helvetica', 'Roboto', sans-serif;
            /* BRUGER vw + vh FOR AT GARANTERE AT DET PASSER */
            font-size: min(10vw, 5.2rem, 12vh);
            font-weight: 900;
            color: #1a1a1a;
            text-shadow: 
                0 2px 4px rgba(255, 255, 255, 0.15),
                0 4px 20px rgba(0, 0, 0, 0.15);
            line-height: 1.0;
            letter-spacing: -0.02em;
            word-break: break-word;
            font-stretch: condensed;
            /* SIKRER AT DET ALDRIG FLYDER OVER */
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* TILLAD WRAP PÅ RIGTIG SMÅ SKÆRME */
        @media (max-width: 380px) {
            .top-title h1 {
                white-space: normal;
                font-size: min(8vw, 2.8rem, 10vh);
            }
            .title-row .flag-icon {
                font-size: min(6vw, 2.4rem);
            }
        }

        .top-title .dotdk {
            font-size: 0.65em;
            opacity: 0.70;
        }

        .top-title .sub {
            font-family: 'Arial', 'Helvetica', 'Roboto', sans-serif;
            font-size: clamp(0.5rem, 1.8vw, 0.9rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.30);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 0.05rem;
            flex-shrink: 0;
        }

        /* ---------- CARD – FYLDER RESTEN ---------- */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.2rem 0 0.5rem;
            /* BEGRÆNS SÅ DET IKKE TAGES OVER */
            max-height: 60vh;
            min-height: 0;
        }

        /* ---------- TEXTBOX ---------- */
        .textbox {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem 0.8rem 2.5rem 0.8rem;
            padding: 1.2rem 1.2rem;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.40), inset 0 1px 3px rgba(255, 255, 255, 0.10);
            text-align: center;
            /* SKALERER MED SKÆRMHØJDEN */
        }

        .textbox p {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            font-size: min(5.5vw, 2.6rem, 7vh);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.50);
            line-height: 1.2;
            letter-spacing: 0.02em;
        }

        .textbox .dato {
            display: inline-block;
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            font-size: min(7vw, 3.4rem, 9vh);
            font-weight: 800;
            background: rgba(255, 255, 255, 0.12);
            padding: 0.05rem 1.2rem;
            border-radius: 4rem;
            color: #ffffff;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.50);
            margin-top: 0.05rem;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .textbox .live-badge {
            display: inline-block;
            background: #ff1744;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: min(1.8vw, 0.8rem, 2.5vh);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.1rem 0.7rem;
            border-radius: 4rem;
            margin-bottom: 0.2rem;
            box-shadow: 0 2px 12px rgba(255, 23, 68, 0.40);
        }

        .card .footer-text {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-size: clamp(0.5rem, 1.5vw, 0.75rem);
            color: rgba(255, 255, 255, 0.40);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.30);
            letter-spacing: 0.12rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.5rem;
            margin-top: 0.5rem;
            width: 70%;
            text-align: center;
            flex-shrink: 0;
        }

        /* ---------- EKSTRA SMÅ SKÆRME ---------- */
        @media (max-height: 650px) {
            .top-title { max-height: 35vh; }
            .top-title h1 { font-size: min(8vw, 3.2rem, 10vh); }
            .title-row .flag-icon { font-size: min(6vw, 2.6rem); }
            .textbox { padding: 0.8rem 0.8rem; }
            .textbox p { font-size: min(4.5vw, 1.8rem, 6vh); }
            .textbox .dato { font-size: min(5.5vw, 2.4rem, 7.5vh); }
            .card { max-height: 55vh; padding: 0.1rem 0 0.2rem; }
            .top-title .sub { font-size: 0.5rem; }
        }

        @media (max-height: 500px) {
            .top-title { max-height: 30vh; }
            .top-title h1 { font-size: min(6vw, 2.2rem, 8vh); }
            .title-row .flag-icon { font-size: min(5vw, 1.8rem); }
            .top-title .sub { display: none; }
            .textbox { padding: 0.5rem 0.5rem; border-radius: 1.8rem 0.4rem 1.8rem 0.4rem; }
            .textbox p { font-size: min(4vw, 1.2rem, 5vh); }
            .textbox .dato { font-size: min(5vw, 1.6rem, 6vh); }
            .card { max-height: 50vh; padding: 0; }
            .footer-text { display: none; }
            .textbox .live-badge { font-size: 0.5rem; padding: 0.05rem 0.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
        }
    </style>
</head>
<body>

    <!-- TITLE – GARANTERET AT PASSE -->
    <header class="top-title">
        <div class="title-row">
            <span class="flag-icon">🇩🇰</span>
            <h1>
                almindeligdansker<span class="dotdk">.dk</span>
            </h1>
        </div>
        <p class="sub">— Danmarks hyggeligste hjørne —</p>
    </header>

    <!-- CARD -->
    <main class="card" role="main">
        <div class="textbox">
            <p>
                <span class="live-badge">● LIVE</span><br />
                Se os live<br />
                <span class="dato">d. 5. September</span>
            </p>
        </div>
        <p class="footer-text">❤️ vi glæder os til at se dig</p>
    </main>

</body>
</html>
