<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>almindeligdansker.dk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TITLE – MED FLAG VED SIDEN -->
    <header class="top-title">
        <div class="title-row">
            <span class="flag-icon">🇩🇰</span>
            <h1>
                almindeligdansker<span class="dotdk">.dk</span>
            </h1>
        </div>
        <p class="sub">— Danmarks hyggeligste hjørne —</p>
    </header>

    <!-- CARD – CENTRERET -->
    <main class="card" role="main">
        <div class="textbox">
            <p>
                <span class="live-badge">● LIVE</span><br />
                Se os live<br />
                <div id="tour-dates-container">
                </div>            
        </p>
        </div>
        <p class="footer-text">❤️ vi glæder os til at se dig</p>
    </main>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('tour-dates.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Tour dates file not found');
                }
                return response.text();
            })
            .then(data => {
                // Split by new lines and create span elements
                const dates = data.split('\n').filter(line => line.trim() !== '');
                const container = document.getElementById('tour-dates-container');
                
                if (container) {
                    container.innerHTML = dates.map(date => 
                        `<span class="dato">${date.trim()}</span>`
                    ).join('');
                }
            })
            .catch(error => {
                console.log('Could not load tour dates:', error);
                // Optionally show a message
                const container = document.getElementById('tour-dates-container');
                if (container) {
                    container.innerHTML = '<span class="dato">Kommer snart!</span>';
                }
            });
    });
</script>
</body>
</html>
